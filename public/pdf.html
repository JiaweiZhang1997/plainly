<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 阅读器 · 释义</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="pdf.css"></head><body class="pdf-reader">
<header class="pdf-toolbar" data-plainly-ui><a href="options.html" target="_blank" class="pdf-brand" aria-label="释义设置"><span class="brand-mark"><!--question-mark--></span><span>释义 <small>PDF</small></span></a><span id="document-title">未打开文档</span><div class="pdf-tools"><button id="native-pdf" class="text-button" hidden>原生阅读器 ↗</button><button id="open-file" class="secondary">打开文件</button><button id="show-url" class="text-button">在线链接</button><button id="pdf-search" class="primary" disabled>按意思找 ↗</button></div><input id="pdf-file" type="file" accept=".pdf,application/pdf" hidden></header>
<section class="pdf-controls" data-plainly-ui><button id="prev-page" class="text-button" aria-label="上一页" disabled>←</button><label>第 <input id="page-number" type="number" min="1" value="1" aria-label="页码" disabled> / <span id="page-count">—</span> 页</label><button id="next-page" class="text-button" aria-label="下一页" disabled>→</button><span class="pdf-separator"></span><label for="zoom">缩放</label><select id="zoom" disabled><option value="fit">适合宽度</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></section>
<form id="url-form" class="pdf-url" data-plainly-ui hidden><label for="pdf-url">PDF 在线地址</label><input id="pdf-url" type="url" placeholder="https://example.com/document.pdf" required><button class="primary" type="submit">打开</button><button id="hide-url" class="text-button" type="button">收起</button></form>
<p id="pdf-status" role="status" aria-live="polite"></p>
<div class="pdf-recovery" data-plainly-ui><button id="retry-pdf" class="secondary" hidden>重试打开</button><button id="enable-file-access" class="secondary" hidden>开启本地文件访问 ↗</button></div><main id="pdf-stage"><section id="pdf-welcome"><h1>PDF 阅读器</h1><button id="welcome-open" class="primary">选择 PDF 文件 ↗</button><p class="hint">本地解析，文件不会上传。使用模型功能时才发送选中文字；<br>主动搜索时向 Jev 发送文档文字片段。单份文件最大 50 MB。</p><p class="hint">支持带文字层的 PDF。扫描件暂无 OCR，暂不支持直接划词。</p></section><div id="pdf-page" hidden><canvas id="pdf-canvas"></canvas><div id="pdf-text" class="textLayer"></div></div></main>
<dialog id="password-dialog"><form method="dialog"><h2>这份 PDF 需要密码</h2><p id="password-note"></p><label for="pdf-password">文档密码</label><input id="pdf-password" type="password" autocomplete="off"><div class="editor-actions"><button value="cancel" class="text-button">取消</button><button value="open" class="primary">打开</button></div></form></dialog>
<script type="module" src="pdf.js"></script></body></html>
